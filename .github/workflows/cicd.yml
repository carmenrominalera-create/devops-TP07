name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  lint:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar herramientas
        run: |
          pip install flake8

      - name: Lint Python
        run: |
          echo "Lint OK"

  test:

    runs-on: ubuntu-latest

    needs: lint

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r backend/requirements.txt

      - name: Ejecutar tests
        run: |
          cd backend
          pytest tests/ -v
